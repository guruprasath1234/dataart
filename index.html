<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeline App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo"><b>🕒 My Timeline</b></div>
    <button id="theme-toggle" aria-label="Switch Theme">Switch Theme</button>
  </header>

  <nav id="filters">
    <!-- we can add in the upcoming tasks -->
  </nav>

  <main>
    <section id="timeline">
        <ul>
            <li onclick="">1990</li>
            <li onclick="">2000</li>
            <li onclick="">2005</li>
            <li onclick="">2015</li>
        </ul>
      <!-- Timeline events will be injected here -->
    </section>
  </main>

  <div id="image-placeholder">
    <img src="images/timeline.png" alt="Decorative timeline banner" />
  </div>

  <div id="modal">
    <!-- Modal content will appear here in future -->
  </div>

</body>
</html>
